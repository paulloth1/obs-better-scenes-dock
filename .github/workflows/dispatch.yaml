name: Dispatch
run-name: Dispatched Repository Actions - ${{ inputs.job }} ⌛️
env:
  # Opt the bundled JS actions into Node 24 (Node 20 is being deprecated).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  workflow_dispatch:
    inputs:
      job:
        description: Dispatch job to run
        required: true
        type: choice
        options:
          - build
permissions:
  contents: write
jobs:
  check-and-build:
    if: inputs.job == 'build'
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
